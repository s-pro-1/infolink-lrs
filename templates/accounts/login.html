{% extends "accounts/auth_layout.html" %}
{% block page_title %}Log in{% endblock %}
{% block heading %}Log in{% endblock %}
{% block body %}
<form method="post" novalidate>{% csrf_token %}
  {% include "accounts/_form.html" with form=form %}
  <button class="lr-btn lr-block" type="submit">Log in</button>
</form>
<p class="mt-3 mb-1"><a href="{% url 'accounts:password_reset' %}">Forgot your password?</a></p>
<p class="mb-0">New here? <a href="{% url 'accounts:register' %}">Create an account</a></p>
{% endblock %}
