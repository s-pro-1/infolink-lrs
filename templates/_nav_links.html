<a href="{% url 'core:about' %}"{% if request.resolver_match.url_name == 'about' %} aria-current="page"{% endif %}>About</a>
{% if user.is_authenticated %}
  <a href="{% url 'core:dashboard' %}"{% if request.resolver_match.url_name == 'dashboard' %} aria-current="page"{% endif %}>Dashboard</a>
  <a href="{% url 'accounts:profile' %}"{% if request.resolver_match.url_name == 'profile' %} aria-current="page"{% endif %}>My profile</a>
  {% if user.is_staff %}<a href="{% url 'admin:index' %}">Admin</a>{% endif %}
  <form method="post" action="{% url 'accounts:logout' %}">{% csrf_token %}
    <button class="lr-link" type="submit">Log out</button>
  </form>
{% else %}
  <a href="{% url 'accounts:login' %}"{% if request.resolver_match.url_name == 'login' %} aria-current="page"{% endif %}>Log in</a>
  <a class="lr-cta" href="{% url 'accounts:register' %}">Create account</a>
{% endif %}
